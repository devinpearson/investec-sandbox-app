# Builds the Mac app when a GitHub release is published, for Apple silicon and
# Intel (each on its own runner: the services' native modules are compiled for
# the machine that builds them), and attaches the .dmg and .zip files to the
# release. Run it by hand (Actions → Release → Run workflow) to build without
# a release; the files are then kept as workflow artifacts.
#
# The release's tag (v1.2.3 or 1.2.3) sets the app's version.
#
# Signing and notarisation turn on when these repository secrets are set
# (Settings → Secrets and variables → Actions); without them the builds are
# unsigned, so macOS asks before opening them and they can't update
# themselves:
#   CSC_LINK                      Developer ID Application certificate (.p12, base64)
#   CSC_KEY_PASSWORD              its password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   for notarisation

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Built apps check this repository's releases for updates.
      SANDBOX_GITHUB_REPO: ${{ github.repository }}
      SANDBOX_RELEASE: '1'
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Without a certificate, don't go looking for one in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
            packages/sim/web/package-lock.json

      - name: Set the version from the release tag
        if: github.event_name == 'release'
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Version $version"
          npm version "$version" --no-git-tag-version --allow-same-version

      # Also runs scripts/setup.mjs: the pinned Node.js, each package's
      # dependencies (native modules compiled here) and the dev database.
      - name: Install
        run: npm ci

      - name: Build the services
        run: npm run build -- --clean

      - name: Package
        run: npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.config.cjs --publish never

      - name: Check the app runs its services
        run: |
          app="release/mac$([ '${{ matrix.arch }}' = arm64 ] && echo -arm64)/Investec Sandbox.app"
          services="$app/Contents/Resources/services"
          "$services/node/bin/node" -e "console.log('Node', process.version, process.arch)"
          (cd "$services/blockly-mcp" && ../node/bin/node investec-blockly-mcp.cjs reference | head -n 3)

      - name: Keep the update info apart
        run: mv release/latest-mac.yml release/latest-mac-${{ matrix.arch }}.yml

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge the update info
        run: node scripts/merge-update-info.mjs dist/latest-mac.yml dist/latest-mac-x64.yml dist/latest-mac-arm64.yml

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm dist/latest-mac-*.yml
          ls -la dist
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
